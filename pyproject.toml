[project]
name = "mamut"
version = "0.3.0"
description = "Transparent tabular classification workflows with model-selection evidence"
authors = [
    { name = "Igor Kolodziej" },
    { name = "Hubert Kowalski" },
    { name = "Julia Przybytniowska" },
]
maintainers = [
    { name = "Igor Kolodziej", email = "igor.kolodziej@proton.me" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "automl",
    "classification",
    "evidence",
    "machine-learning",
    "model-selection",
    "tabular-data",
    "validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "scikit-learn==1.5.2",
    "optuna>=4.1.0,<5.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "xgboost==2.1.3",
    "numpy>=2.0.0,<2.1.0",
    "scipy>=1.15.0,<2.0.0",
    "joblib>=1.4.2,<2.0.0",
    "imbalanced-learn>=0.13.0,<0.14.0",
    "Jinja2>=3.0.2,<4.0.0",
    "psutil>=6.1.1,<7.0.0",
    "shap>=0.46.0,<0.47.0",
    "lightgbm>=4.6.0,<5.0.0",
    "catboost>=1.2.10,<2.0.0",
]

[project.urls]
Documentation = "https://mamut.readthedocs.io/en/latest/"
Homepage = "https://github.com/przybytniowskaj/Mamut"
Issues = "https://github.com/przybytniowskaj/Mamut/issues"
Repository = "https://github.com/przybytniowskaj/Mamut"

[dependency-groups]
test = [
    "pytest>=8.3.4,<10.0.0",
]
lint = [
    "deptry>=0.24.0,<0.26.0",
    "pre-commit>=4.0.1,<5.0.0",
]
docs = [
    "pygments>=2.19.0,<3.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<4.0.0",
    "nbsphinx>=0.9.6,<0.10.0",
    "nbconvert>=7.16.5,<8.0.0",
    "ipykernel>=6.29.5,<8.0.0",
    "sphinx-sitemap>=2.9.0,<3.0.0",
]
package = [
    "twine>=6.1.0,<7.0.0",
]
security = [
    "pip-audit>=2.9.0,<3.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "package" },
    { include-group = "security" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mamut"]

[tool.isort]
profile = "black"

[tool.deptry]
extend_exclude = ["debug", "docs"]
ignore_notebooks = true
known_first_party = ["mamut"]
package_module_name_map = { "imbalanced-learn" = "imblearn", "scikit-learn" = "sklearn" }

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated.*:DeprecationWarning:numpy\\.ma\\.extras",
]
