[project]
name = "mamut"
version = "0.1.2"
description = "Machine Automated Modelling and Utility Toolkit"
authors = [
    { name = "Igor Kolodziej", email = "igor.kolodziej@proton.me" },
    { name = "Hubert Kowalski" },
    { name = "Julia Przybytniowska" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "scikit-learn==1.5.2",
    "optuna>=4.1.0,<5.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "xgboost==2.1.3",
    "numpy>=2.0.0,<2.1.0",
    "scipy>=1.15.0,<2.0.0",
    "joblib>=1.4.2,<2.0.0",
    "imbalanced-learn>=0.13.0,<0.14.0",
    "Jinja2>=3.0.2,<4.0.0",
    "psutil>=6.1.1,<7.0.0",
    "shap>=0.46.0,<0.47.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.4,<9.0.0",
]
lint = [
    "pre-commit>=4.0.1,<5.0.0",
]
docs = [
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<4.0.0",
    "nbsphinx>=0.9.6,<0.10.0",
    "nbconvert>=7.16.5,<8.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mamut"]

[tool.isort]
profile = "black"
