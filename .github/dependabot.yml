version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      ml-runtime:
        patterns:
          - "numpy"
          - "scikit-learn"
          - "xgboost"
          - "shap"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        patterns:
          - "deptry"
          - "pre-commit"
          - "pytest"
          - "twine"
        update-types:
          - "minor"
          - "patch"
      docs-tooling:
        patterns:
          - "pygments"
          - "sphinx"
          - "sphinx-*"
          - "nbsphinx"
          - "nbconvert"
        update-types:
          - "minor"
          - "patch"
      security-tooling:
        patterns:
          - "pip-audit"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "scikit-learn"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "xgboost"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "shap"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
