name: Test Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check dependency declarations
        run: uv run deptry .

      - name: Run tests
        run: uv run pytest

      - name: Execute documentation walkthrough
        run: |
          uv run python -m ipykernel install --user --name mamut-docs-ci
          uv run jupyter nbconvert --to notebook --execute \
            docs/source/notebooks/walkthrough.ipynb \
            --output walkthrough.executed.ipynb \
            --output-dir "${RUNNER_TEMP}" \
            --ExecutePreprocessor.kernel_name=mamut-docs-ci \
            --ExecutePreprocessor.timeout=300

      - name: Install documentation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pandoc

      - name: Build documentation with warnings as errors
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html-strict

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Smoke test built wheel
        run: |
          WHEEL="$(find dist -name 'mamut-*.whl' -print -quit)"
          uv run --isolated --no-project --with "$WHEEL" python tests/smoke_package.py
