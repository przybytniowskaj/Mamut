name: Test Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check dependency declarations
        run: uv run deptry .

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Smoke test built wheel
        run: |
          WHEEL="$(find dist -name 'mamut-*.whl' -print -quit)"
          uv run --isolated --no-project --with "$WHEEL" python tests/smoke_package.py
